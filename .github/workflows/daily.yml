name: Daily job scan

on:
  schedule:
    - cron: "30 3 * * *"     # every day 03:30 UTC = 9:00 AM IST
  workflow_dispatch:          # lets you press "Run workflow" by hand
    inputs:
      full_scan:
        description: "Look back 7 days instead of 2"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          FULL_SCAN: ${{ inputs.full_scan }}
        run: python -m scraper.run
      - name: Publish daily summary
        if: always()
        run: test -f data/SUMMARY.md && cat data/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save results
        if: always()
        run: |
          git config user.name "job-hunt-bot"
          git config user.email "job-hunt-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git push

# ---- Kanav's search profile. Edit freely; the daily run reads this file. ----
recency_hours_first_run: 168      # 7 days on the very first run
recency_hours_daily: 48           # daily runs look back 48h (overlap so nothing is missed); "new" = not seen before
max_age_days_on_dashboard: 7      # roles older than this drop off the "active" view

experience:
  min: 1
  max: 5
  stretch_max_min: 5              # roles asking more than 5 yrs minimum are dropped; exactly 5+ is a stretch (Tier C)

salary_floor:                      # annual, stated OR estimated
  INR: 2000000                     # 20 LPA
  AED: 180000
  SGD: 60000
  GBP: 35000
  USD: 55000
  EUR: 40000

locations:
  india: [india, bengaluru, bangalore, gurugram, gurgaon, mumbai, delhi, new delhi, noida, pune, hyderabad, chennai, kolkata, ahmedabad, jaipur, chandigarh, remote]
  international: [dubai, abu dhabi, united arab emirates, uae, singapore, london, united kingdom]

# Title must match at least one of these (case-insensitive regex fragments)

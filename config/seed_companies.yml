# WIDER COMPANY LIST — careers portals only (no LinkedIn search per company, so adding 100s here is cheap).
#
# How it works: each run, a company here without a known portal is checked on Darwinbox, Keka, Greenhouse, Lever,
# Ashby, Workable, Recruitee and SmartRecruiters using the slugs listed (the part of the portal address that
# names the company, e.g. jobs.lever.co/<slug>). A portal found is remembered in data/portals.json and read
# fully every run after that; a company with no portal found is re-checked every 14 days. Portals are also
# learned automatically from apply links on LinkedIn / Indeed / Google Jobs, which fixes wrong or missing slugs.
#
# Roles from these companies need a strong title (strategy, growth, founder's office, program, BD, GTM …) and a
# decent CV match to be kept, but — unlike random companies — they don't also need "MBA" or a stated salary.
#
# group: saas = SaaS / B2B tech / fintech infra (shows as "SaaS & B2B"); startup = consumer & other startups
# band: pay band used to estimate salary when it isn't stated (see config/companies.yml)
#
# This list was assembled from general knowledge, not verified against each portal. After the first run,
# health.json shows which ones resolved. Add or delete freely.


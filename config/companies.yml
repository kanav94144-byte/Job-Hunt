# Every company is searched on LinkedIn + Naukri by name (results are matched on company name).
# Where the company's own careers portal has a readable job feed, "ats" pulls it directly too.
# aliases: other spellings of the company name as they appear on LinkedIn/Naukri.
# group: "target" = your list, "startup" = funded startups known to hire tier-1 MBAs.


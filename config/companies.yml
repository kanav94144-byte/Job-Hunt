# Open searches (not tied to a company) to discover other startups/companies.
# Results from these are only kept if they mention MBA/tier-1 OR state salary >= floor.
discovery_searches:
  india:
    - "founder's office"
    - "chief of staff"
    - "strategy manager"
    - "growth manager"
    - "strategy and operations"
    - "business development manager B2B"
    - "program manager strategy"
    - "category manager"
    - "AI strategy"
    - "MBA strategy"
  international:
    - {term: "strategy manager MBA", location: "Dubai, United Arab Emirates"}
    - {term: "strategy manager MBA", location: "Singapore"}
    - {term: "chief of staff", location: "Singapore"}

# HOW THIS LIST WORKS
# 1. If a company has "ats", its own careers portal is read first (verified connectors).
# 2. If not, the scanner tries to detect a Darwinbox/Keka portal automatically (and remembers it in data/portals.json).
# 3. If no portal is readable, LinkedIn is searched by company name as a fallback.
# aliases = how the company name appears on LinkedIn. group = target (your list) | similar (competitors) | startup
# band = pay band used to estimate salary when not stated: mnc_top, big4, listed_tech, unicorn, funded_startup, d2c, large_indian

companies:
  # ======================= YOUR LIST =======================
  - name: Porter
    aliases: ["Porter", "SmartShift Logistics Solutions"]
    linkedin_query: "Porter logistics"
    group: target
    band: unicorn
    ats: {type: darwinbox, tenant: porter}
  - name: American Express
    aliases: ["American Express", "Amex"]
    group: target
    band: mnc_top
    ats: {type: oracle_hcm, api_host: egug.fa.us2.oraclecloud.com, site: CX_1, location_id: "300000000228786", public_base: "https://careers.americanexpress.com/en/sites/CX_1"}

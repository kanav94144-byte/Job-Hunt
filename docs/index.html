<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Hunt Dashboard</title>
<style>
  :root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e5e5e2;--a:#0b7a4b;--b:#2856c9;--c:#8a6d00;--new:#d9480f;--chip:#efefec}
  @media (prefers-color-scheme:dark){:root{--bg:#131314;--card:#1c1c1e;--ink:#ececec;--mute:#9a9aa0;--line:#2e2e31;--a:#3fcf8e;--b:#7ea2ff;--c:#e0b43a;--new:#ff8a4c;--chip:#2a2a2d}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:24px;margin:0 0 4px} .sub{color:var(--mute);margin:0 0 20px}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:130px}
  .stat b{display:block;font-size:22px} .stat span{color:var(--mute);font-size:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  input[type=search]{flex:1;min-width:200px}
  label.chk{display:flex;gap:6px;align-items:center;color:var(--mute)}
  .tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;min-width:980px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card);cursor:pointer;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .tier{display:inline-block;font-weight:700;border-radius:6px;padding:2px 8px;font-size:12px;color:#fff}
  .tA{background:var(--a)} .tB{background:var(--b)} .tC{background:var(--c)}
  .new{color:var(--new);font-weight:700;font-size:11px;margin-left:6px}
  .role a{color:var(--ink);font-weight:600;text-decoration:none} .role a:hover{text-decoration:underline}
  .mute{color:var(--mute);font-size:12px} .chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 6px;font-size:11px;margin:2px 2px 0 0}
  .why{max-width:260px}
  select.status{padding:4px 6px;font-size:12px}
  .empty{padding:40px;text-align:center;color:var(--mute)}
  details{margin-top:18px;color:var(--mute)} details pre{white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Job Hunt Dashboard</h1>
  <p class="sub" id="updated">Loading…</p>

  <div class="stats">
    <div class="stat"><b id="sNew">–</b><span>new today</span></div>
    <div class="stat"><b id="sA">–</b><span>Tier A · MBA asked</span></div>
    <div class="stat"><b id="sB">–</b><span>Tier B · CV-relevant</span></div>
    <div class="stat"><b id="sC">–</b><span>Tier C · stretch</span></div>
    <div class="stat"><b id="sAll">–</b><span>active roles (7 days)</span></div>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="Search role, company, city…">
    <select id="tier"><option value="">All tiers</option><option>A</option><option>B</option><option>C</option></select>
    <select id="group"><option value="">All companies</option><option value="target">My list</option><option value="startup">Startups</option><option value="discovered">Discovered</option></select>
    <select id="region"><option value="">India + abroad</option><option value="india">India</option><option value="international">International</option></select>
    <select id="statusF"><option value="">Any status</option><option value="none">Not marked</option><option>Applied</option><option>Interested</option><option>Skip</option></select>
    <label class="chk"><input type="checkbox" id="onlyNew"> New today only</label>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th data-k="tier">Tier</th><th data-k="title">Role</th><th data-k="company">Company</th><th data-k="location">Location</th>
        <th data-k="exp_min">Experience</th><th data-k="mba">MBA</th><th data-k="salary_label">Pay</th>
        <th data-k="posted">Posted</th><th>Why it fits</th><th>My status</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No roles match these filters.</div>
  </div>
  <details><summary>Source health (last run)</summary><pre id="health">–</pre></details>
</div>
<script>
let JOBS=[], sortK=null, sortDir=1;
const $=id=>document.getElementById(id);
const st=()=>{try{return JSON.parse(localStorage.getItem('jobStatus')||'{}')}catch(e){return {}}};
const setSt=(k,v)=>{try{const s=st(); v?s[k]=v:delete s[k]; localStorage.setItem('jobStatus',JSON.stringify(s))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('jobs.json?'+Date.now()).then(r=>r.json()).then(d=>{
  JOBS=d.jobs||[];
  $('updated').textContent=`Updated ${d.updated} · refreshes every morning (9am IST)`;
  $('sNew').textContent=d.new_today; $('sAll').textContent=d.count;
  ['A','B','C'].forEach(t=>$('s'+t).textContent=JOBS.filter(j=>j.tier===t).length);
  render();
}).catch(()=>{$('updated').textContent='No data yet – the first run has not finished.'});
fetch('health.json?'+Date.now()).then(r=>r.json()).then(h=>{
  const lines=Object.entries(h.sources||{}).map(([k,v])=>`${v.failed?'⚠️':'✓'} ${k}: ${v.jobs} jobs${v.failed?` · ${v.failed} failed – ${(v.errors||[]).slice(-1)[0]||''}`:''}`);
  $('health').textContent=JSON.stringify(h.counts||{})+'\n'+lines.join('\n');
}).catch(()=>{});

['q','tier','group','region','statusF','onlyNew'].forEach(id=>$(id).addEventListener('input',render));
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k; sortDir=sortK===k?-sortDir:1; sortK=k; render();});

function render(){
  const q=$('q').value.toLowerCase(), t=$('tier').value, g=$('group').value, r=$('region').value, sf=$('statusF').value, on=$('onlyNew').checked, S=st();
  let rows=JOBS.filter(j=>(!t||j.tier===t)&&(!g||j.group===g)&&(!r||j.region===r)&&(!on||j.is_new)
    &&(!q||(j.title+' '+j.company+' '+j.location).toLowerCase().includes(q))
    &&(!sf||(sf==='none'?!S[j.key]:S[j.key]===sf)));
  if(sortK) rows=[...rows].sort((a,b)=>((a[sortK]??'')>(b[sortK]??'')?1:(a[sortK]??'')<(b[sortK]??'')?-1:0)*sortDir);
  $('empty').hidden=rows.length>0;
  $('rows').innerHTML=rows.map(j=>{
    const mba=j.mba&&j.mba.startsWith('Yes')?`<span title="${esc(j.mba)}">✅ Yes</span>`:'<span class="mute">not mentioned</span>';
    const why=(j.reasons||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')+`<div class="mute">CV match score ${j.relevance}</div>`;
    const src=(j.sources||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('');
    const sv=S[j.key]||'';
    return `<tr>
      <td><span class="tier t${j.tier}">${j.tier}</span></td>
      <td class="role"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>${j.is_new?'<span class="new">NEW</span>':''}<div>${src}</div></td>
      <td>${esc(j.company)}<div class="mute">${j.group==='target'?'my list':j.group}</div></td>
      <td>${esc(j.location)}</td>
      <td>${esc(j.exp_label)}</td>
      <td>${mba}</td>
      <td>${esc(j.salary_label)}</td>
      <td>${esc(j.posted||'')}</td>
      <td class="why">${why}</td>
      <td><select class="status" data-k="${esc(j.key)}"><option value=""></option>${['Interested','Applied','Skip'].map(o=>`<option ${sv===o?'selected':''}>${o}</option>`).join('')}</select></td>
    </tr>`}).join('');
  document.querySelectorAll('select.status').forEach(s=>s.onchange=()=>setSt(s.dataset.k,s.value));
}
</script>
</body>
</html>
